        # Constructor Fabric bottom panel with task switcher for minimized windows.
        Global {
          edge=bottom
          allign=left
          margin=0
          widthtype=percent
          width=100
          height=36
          transparent=0
          tintcolor=#07111f
          alpha=235
          autohide=0
          heightwhenhidden=2
          setdocktype=1
          setpartialstrut=1
          usefontcolor=1
          fontcolor=#eef6ff
          background=0
          iconsize=24
        }
        Plugin {
          type=space
          Config {
            Size=6
          }
        }
        Plugin {
          type=menu
          Config {
            image=/root/constructor-fabric/app/icon.png
            system {
            }
            separator {
            }
            item {
              name=Run
              image=system-run
              command=run
            }
            item {
              name=Terminal
              image=utilities-terminal
              command=lxterminal --working-directory=/root/workspaces/constructor-fabric-workspace
            }
            item {
              name=Workspace
              image=folder
              command=pcmanfm /root/workspaces/constructor-fabric-workspace
            }
          }
        }
        Plugin {
          type=launchbar
          Config {
            Button {
              id=/root/Desktop/Constructor-Fabric-Trainer.desktop
            }
            Button {
              id=/root/Desktop/Codex-Constructor-Fabric.desktop
            }
            Button {
              id=/root/Desktop/Claude-Code-Constructor-Fabric.desktop
            }
          }
        }
        Plugin {
          type=space
          Config {
            Size=8
          }
        }
        Plugin {
          type=taskbar
          Config {
            tooltips=1
            IconsOnly=0
            ShowAllDesks=1
            UseMouseWheel=1
            UseUrgencyHint=1
            FlatButton=0
            MaxTaskWidth=260
            spacing=2
            GroupedTasks=0
          }
        }
        Plugin {
          type=space
          Config {
            Size=8
          }
        }
        Plugin {
          type=tray
        }
        Plugin {
          type=dclock
          Config {
            ClockFmt=%H:%M
            TooltipFmt=%A %x
            BoldFont=1
          }
        }
