<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constructor Fabric Showcase Guideline</title>
  <style>
    :root{color-scheme:dark;--bg:#162a42;--panel:#1e3654;--panel2:#243e5e;--text:#eef6ff;--muted:#b0c4d8;--accent:#2dd4bf;--accent2:#60a5fa;--ok:#34d399;--gold:#f7c873}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 18% 0%,#2a5a8c 0,#162a42 42%,#0e1e30 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px}
    .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:12px 10px;background:rgba(14,30,48,.76);border-right:1px solid rgba(255,255,255,.08)}
    .brand{display:flex;gap:8px;align-items:center;margin-bottom:10px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#04111f;font-size:11px;box-shadow:0 8px 20px rgba(45,212,191,.18)}.brand h1{font-size:11px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:9px}
    .step{display:flex;gap:6px;padding:6px 6px;margin:3px 0;border-radius:8px;color:var(--muted);cursor:pointer;border:1px solid transparent;font-size:10px}.step.active{background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.35);color:var(--text)}.num{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#1a3050;color:#cce4ff;font-weight:800;font-size:9px;flex-shrink:0}.step.active .num{background:var(--accent);color:#05201d}.step b{display:block;font-size:10px}.step span{font-size:8px}
    .main{padding:14px 18px}.card{background:linear-gradient(180deg,rgba(30,54,84,.94),rgba(16,30,52,.94));border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.30);min-height:0;display:flex;flex-direction:column}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(45,212,191,.35);color:#9ff5e9;background:rgba(45,212,191,.09);border-radius:999px;padding:4px 8px;font-size:9px;margin-bottom:8px}.status-dot{width:6px;height:6px;background:var(--ok);border-radius:99px;box-shadow:0 0 8px var(--ok)}
    h2{font-size:16px;line-height:1.1;margin:8px 0 6px}.lead{font-size:11px;color:#c9d8e8;line-height:1.5;max-width:850px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.box{background:rgba(255,255,255,.048);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:8px}.box b{display:block;margin-bottom:4px;color:#fff;font-size:10px}.box p,.box li{color:var(--muted);line-height:1.45;margin:0;font-size:10px}.quote{border-left:3px solid var(--accent);background:rgba(45,212,191,.075);padding:8px 10px;border-radius:8px;color:#dffdf8;line-height:1.45;margin-top:10px;font-size:10px}.code,.prompt-text{font-family:"SFMono-Regular",Consolas,monospace;background:#0e1a2c;border:1px solid rgba(255,255,255,.11);border-radius:8px;padding:8px;color:#d7ecff;white-space:pre-wrap;font-size:10px}.prompt{margin-top:10px}.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}.prompt-head b{color:#fff;font-size:10px}.prompt-head span{color:var(--muted);font-size:8px}.prompt-text{width:100%;min-height:60px;resize:none;outline:0;background:#111827;color:#cbd5e1;border-color:#334155;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);cursor:text;font-size:9px}.prompt-text[readonly]{user-select:text;-webkit-user-select:text}.copy-ok{color:#9ff5e9;font-size:9px;margin-left:6px}.buttons{display:flex;gap:8px;align-items:center;margin-top:10px}.btn{border:0;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:10px}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#02111f}.secondary{background:#172944;color:#d8e9ff;border:1px solid rgba(255,255,255,.10)}.foot{margin-top:8px;color:var(--muted);font-size:9px}.accent{color:var(--gold)}
  </style>
</head>
<body>
  <div class="app"><aside class="side"><div class="brand"><div class="logo">CF</div><div><h1>Constructor Fabric</h1><p>Showcase Guideline</p></div></div><div id="nav"></div></aside><main class="main"><section class="card"><div class="pill"><span class="status-dot"></span><span id="configPill">Ready for the guided showcase</span></div><div id="content"></div><div class="buttons"><button class="btn secondary" id="prev">Back</button><button class="btn primary" id="next">Next step</button></div><div class="foot" id="foot"></div></section></main></div>
  <script>
  const steps = [
    {t:'Welcome',s:'Showcase path',h:'Welcome to Constructor Fabric Showcase Guideline',body:'Constructor Fabric is an open-source AI fabric for Software as a Service. It connects the entire software development lifecycle: plan, build, run — with reusable components, operational automation, and built-in productivity measurement. This guide walks you through its three core elements and how to use them.',boxes:[['What you will learn','How Constructor Studio structures your SDLC with traceable specs, how Constructor Insight measures productivity, and how Constructor Gears provides reusable components.'],['Three elements','Constructor Studio (governance), Constructor Insight (benchmarking), Constructor Gears (reusable stack). Use any one independently or combine them.']],quote:'Constructor Fabric is not an IDE, not a CI/CD tool, not project management. It weaves processes, tools, and reusable components into one traceable flow from requirements to production.'},
    {t:'Studio init',s:'Setup workspace',h:'Initialize a Constructor Studio workspace',body:'Start by setting up Constructor Studio in your repository. The cfs CLI creates the control surface — generated AI coding tool integration files, configuration, and the validation infrastructure that keeps everything traceable.',boxes:[['What gets created','.cf-studio/ directory with config, generated host integrations for Cursor, Windsurf, Claude Code, Copilot, Codex, and workflow routing.'],['Who uses it','Engineering managers, architects, and CTOs who need consistent, AI-governed delivery across teams and repositories.']],code:'cfs init\ncfs generate-agents\ncfs config show'},
    {t:'Traceability',s:'IDs & links',h:'Understand traceability IDs',body:'Constructor Fabric assigns deterministic IDs to every artifact — requirements, design, plans, and code. These IDs connect the entire lifecycle so drift is surfaced early instead of being reconstructed ad hoc during review.',boxes:[['How it works','Every PRD goal, feature, task, and implementation change gets a stable ID. Cross-link validation proves alignment across artifacts.'],['Why it matters','AI generation is bounded by specifications, not free-form prompting. Consistency is enforced, not hoped for.']],prompt:'/cf-constructor Create a PRD for a lightweight team task manager. Assign traceability IDs to each goal and acceptance criterion so they can be linked to features and implementation tasks later.'},
    {t:'Spec templates',s:'Checklists & specs',h:'Use SPEC templates and checklists',body:'Constructor Studio provides structured templates for specifications, designs, and implementation plans. Each template includes checklists that make review expectations visible instead of leaving them implicit in chat or memory.',boxes:[['Templates available','PRD template, design spec, implementation plan, code review checklist, deployment spec.'],['ISO 29148 compliance','Spec templates follow ISO 29148 requirements documentation standards for traceability and completeness.']],prompt:'/cf-constructor Generate a design spec from the PRD using the Constructor Studio template. Include architectural decisions, component boundaries, API contracts, data model, and non-functional requirements.'},
    {t:'Decompose',s:'PRD → features',h:'Decompose the product into features',body:'Split the PRD into features. Each feature should have clear value, acceptance criteria, dependencies, and a traceable link back to the product goals via Constructor Fabric IDs.',boxes:[['Feature examples','Authentication, project workspace, task workflow, comments, notifications, API surface, audit/history.'],['Traceability','Each feature links back to one or more PRD goals. Dependencies between features are explicit.']],prompt:'/cf-constructor Decompose the PRD into feature artifacts. For each feature include user value, acceptance criteria, dependencies, risks, and traceability back to the PRD goals.'},
    {t:'Tasks',s:'Features → backlog',h:'Turn features into implementation tasks',body:'For each feature, produce engineering tasks small enough to execute and review. Tasks include intent, expected files or modules, tests, completion criteria, and traceability links.',boxes:[['Task quality bar','Each task should be independently reviewable and traceable to a feature and PRD goal.'],['Brownfield support','Constructor Studio handles existing codebases — tasks can reference and modify existing modules, not just create new ones.']],prompt:'/cf-constructor Create an implementation task backlog. Each task must include intent, expected files or modules, test requirements, completion criteria, dependencies, and traceability to PRD and feature IDs.'},
    {t:'Plans',s:'Backlog → execution',h:'Create implementation-ready plans',body:'Convert the backlog into a sequenced execution plan. Plans explain ordering, risks, test strategy, and review checkpoints so another agent or engineer can implement safely.',boxes:[['Plan includes','Sequenced milestones, quality gates, test strategy, risk mitigation, rollback notes, and validation commands.'],['Review checkpoints','Defined validation steps at each milestone — deterministic checks that prove alignment before moving forward.']],prompt:'/cf-constructor Produce implementation plans for the task backlog. Include sequencing, milestones, tests, risks, rollback notes, review checkpoints, and validation commands.'},
    {t:'Generate',s:'AI code gen',h:'Generate code with bounded AI',body:'Use Constructor Studio to generate implementation code through your preferred AI coding tool. The generation is bounded by specs and traceability — not free-form prompting. Generated artifacts are reviewed against approved specs.',boxes:[['Supported hosts','Cursor, Windsurf, VS Code/Copilot, Claude Code, Codex — integration files are auto-generated by cfs generate-agents.'],['Sub-agent support','Constructor Studio supports sub-agent workflows for parallel code generation across modules.']],prompt:'/cf-constructor Generate the implementation for the task backlog items. Follow the spec templates, maintain traceability IDs, and ensure each generated module passes the checklist before marking tasks complete.'},
    {t:'Validate',s:'Deterministic checks',h:'Run deterministic validation',body:'Run cfs validate to prove that artifacts are discoverable, linked, and consistent. Validation checks structure, references, cross-repository alignment, and traceability completeness.',code:'cfs validate\ncfs list-ids\ncfs toc',boxes:[['What validation checks','ID resolution, cross-link integrity, orphan artifact detection, spec completeness, and consistency across repositories.'],['CI integration','Run cfs validate in CI pipelines to catch drift before merge. Deterministic checks for AI-generated output.']],prompt:'/cf-constructor Fix any validation or traceability issues reported by cfs validate. Then summarize the final artifact structure, resolved IDs, and any remaining gaps.'},
    {t:'Insight',s:'Productivity',h:'Measure with Constructor Insight',body:'Constructor Insight defines roles and activities, connects to your systems through ready-to-use connectors (including AI tools), and measures productivity at individual, team, and organization levels.',boxes:[['What it measures','Structure (Studio usage), Stack (Gears usage), efficiency, performance, reliability, versatility, and AI adoption correlation.'],['Drill-down','Go from headline metrics down to source data. Identify where AI investments actually move the needle.']],prompt:'/cf-constructor Set up Constructor Insight for the project. Define roles (developer, architect, PM), connect to the repository, and configure productivity metrics to track AI adoption impact.'},
    {t:'Gears',s:'Components',h:'Use Constructor Gears reusable components',body:'Constructor Gears is a stack of reusable components: BSS (Business Support System) modules, platform services, and integration engines. Use them to avoid building common infrastructure from scratch.',boxes:[['Component types','Authentication, billing, notifications, messaging, API gateway, database modules, background workers, and integration connectors.'],['How to use','Reference Gears components in your spec templates and task backlog. Constructor Studio validates that your design aligns with available reusable modules.']],prompt:'/cf-constructor Review the task manager design against available Constructor Gears components. Identify which modules (auth, notifications, billing) can be reused and which need custom implementation. Update the plan accordingly.'},
    {t:'Review',s:'Quality gate',h:'Final review and handoff',body:'Run a full workspace review. Verify all artifacts are consistent, traceable, and ready for sustained development. Export or commit the workspace for team access.',boxes:[['Review checklist','All IDs resolve, no orphan tasks, every feature traces to a PRD goal, validation passes, and specs match implementation.'],['Handoff','Commit the workspace with .cf-studio/ config. Team members can cfs init and pick up where you left off.']],prompt:'/cf-constructor Run a full workspace review. Verify traceability completeness, check for orphan artifacts, validate all cross-links, and produce a summary report for team handoff.'}
  ];
  let idx=0;
  function renderNav(){document.getElementById('nav').innerHTML=steps.map((x,i)=>'<div class="step '+(i===idx?'active':'')+'" data-i="'+i+'"><div class="num">'+(i+1)+'</div><div><b>'+x.t+'</b><span>'+x.s+'</span></div></div>').join('');document.querySelectorAll('.step').forEach(e=>e.onclick=()=>{idx=Number(e.dataset.i);render();});}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function render(){renderNav();const x=steps[idx];let html='<h2>'+esc(x.h)+'</h2><p class="lead">'+esc(x.body)+'</p>';if(x.quote){html+='<div class="quote">'+esc(x.quote)+'</div>';}if(x.boxes){html+='<div class="grid">'+x.boxes.map(b=>'<div class="box"><b>'+esc(b[0])+'</b><p>'+esc(b[1])+'</p></div>').join('')+'</div>';}if(x.prompt){html+='<div class="prompt"><div class="prompt-head"><div><b>Prompt to copy into IDE</b><br><span>Copy this text, paste it into Cursor, Windsurf, VS Code/Copilot, Codex, or Claude Code, then send.</span></div><button class="btn secondary" id="copyPrompt" title="Copy prompt to clipboard">⧉ Copy prompt</button></div><textarea class="prompt-text" id="promptText" readonly spellcheck="false" aria-label="Prompt text to copy">'+esc(x.prompt)+'</textarea><span class="copy-ok" id="copyStatus"></span></div>';}if(x.code){html+='<div class="code">'+esc(x.code)+'</div>';}document.getElementById('content').innerHTML=html;const copy=document.getElementById('copyPrompt');if(copy){copy.onclick=async()=>{const ta=document.getElementById('promptText');ta.focus();ta.select();let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(ta.value);ok=true;}}catch(e){}if(!ok){try{ok=document.execCommand('copy');}catch(e){ok=false;}}document.getElementById('copyStatus').textContent=ok?'Copied to clipboard.':'Selected — press Ctrl+C, then paste into your IDE.';};}document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===steps.length-1?'Finish showcase':'Next step';document.getElementById('foot').textContent='Step '+(idx+1)+' of '+steps.length+' — Constructor Fabric basic flow showcase';document.getElementById('configPill').textContent='Constructor Studio + Insight + Gears — full SDLC fabric';}
  document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
  document.getElementById('next').onclick=()=>{if(idx<steps.length-1){idx++;render();}else{window.close();}};
  render();
  </script>
</body>
</html>
