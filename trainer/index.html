<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constructor Fabric AI Fabric Trainer</title>
  <style>
    :root{color-scheme:dark;--bg:#162a42;--panel:#1e3654;--panel2:#243e5e;--text:#eef6ff;--muted:#b0c4d8;--accent:#2dd4bf;--accent2:#60a5fa;--ok:#34d399;--gold:#f7c873}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 18% 0%,#2a5a8c 0,#162a42 42%,#0e1e30 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px}
    .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:12px 10px;background:rgba(14,30,48,.76);border-right:1px solid rgba(255,255,255,.08)}
    .brand{display:flex;gap:8px;align-items:center;margin-bottom:10px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#04111f;font-size:11px;box-shadow:0 8px 20px rgba(45,212,191,.18)}.brand h1{font-size:11px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:9px}
    .step{display:flex;gap:6px;padding:6px 6px;margin:3px 0;border-radius:8px;color:var(--muted);cursor:pointer;border:1px solid transparent;font-size:10px}.step.active{background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.35);color:var(--text)}.num{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#1a3050;color:#cce4ff;font-weight:800;font-size:9px;flex-shrink:0}.step.active .num{background:var(--accent);color:#05201d}.step b{display:block;font-size:10px}.step span{font-size:8px}
    .main{padding:14px 18px}.card{background:linear-gradient(180deg,rgba(30,54,84,.94),rgba(16,30,52,.94));border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.30);min-height:0;display:flex;flex-direction:column}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(45,212,191,.35);color:#9ff5e9;background:rgba(45,212,191,.09);border-radius:999px;padding:4px 8px;font-size:9px;margin-bottom:8px}.status-dot{width:6px;height:6px;background:var(--ok);border-radius:99px;box-shadow:0 0 8px var(--ok)}
    h2{font-size:16px;line-height:1.1;margin:8px 0 6px}.lead{font-size:11px;color:#c9d8e8;line-height:1.5;max-width:850px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.box{background:rgba(255,255,255,.048);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:8px}.box b{display:block;margin-bottom:4px;color:#fff;font-size:10px}.box p,.box li{color:var(--muted);line-height:1.45;margin:0;font-size:10px}.quote{border-left:3px solid var(--accent);background:rgba(45,212,191,.075);padding:8px 10px;border-radius:8px;color:#dffdf8;line-height:1.45;margin-top:10px;font-size:10px}.code,.prompt-text{font-family:"SFMono-Regular",Consolas,monospace;background:#0e1a2c;border:1px solid rgba(255,255,255,.11);border-radius:8px;padding:8px;color:#d7ecff;white-space:pre-wrap;font-size:10px}.prompt{margin-top:10px}.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}.prompt-head b{color:#fff;font-size:10px}.prompt-head span{color:var(--muted);font-size:8px}.prompt-text{width:100%;min-height:60px;resize:none;outline:0;background:#111827;color:#cbd5e1;border-color:#334155;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);cursor:text;font-size:9px}.prompt-text[readonly]{user-select:text;-webkit-user-select:text}.copy-ok{color:#9ff5e9;font-size:9px;margin-left:6px}.buttons{display:flex;gap:8px;align-items:center;margin-top:10px}.btn{border:0;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:10px}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#02111f}.secondary{background:#172944;color:#d8e9ff;border:1px solid rgba(255,255,255,.10)}.foot{margin-top:8px;color:var(--muted);font-size:9px}.accent{color:var(--gold)}
  </style>
</head>
<body>
  <div class="app"><aside class="side"><div class="brand"><div class="logo">CF</div><div><h1>Constructor Fabric</h1><p>AI Fabric Trainer</p></div></div><div id="nav"></div></aside><main class="main"><section class="card"><div class="pill"><span class="status-dot"></span><span id="configPill">Ready for the AI fabric trainer</span></div><div id="content"></div><div class="buttons"><button class="btn secondary" id="prev">Back</button><button class="btn primary" id="next">Next step</button></div><div class="foot" id="foot"></div></section></main></div>
  <script>
  const steps = [
    {t:'Welcome',s:'Overview',h:'Constructor Fabric — AI fabric for SaaS',body:'Constructor Fabric connects the entire software development lifecycle: plan, build, run. It weaves processes, tools, and reusable components into one traceable flow from requirements to production. This guide walks you through the SDLC pipeline using Constructor Studio.',boxes:[['What you will learn','How to use the PRD → ADR → DESIGN → DECOMPOSITION → FEATURE → CODE pipeline with deterministic validation, traceability IDs, and AI governance.'],['Three elements','Constructor Studio (SDLC governance), Constructor Insight (productivity benchmarking), Constructor Gears (reusable components — not covered in this build).']],quote:'Constructor Fabric is not an IDE, not a CI/CD tool, not project management. It adds structure, traceability, and validation to your existing AI coding workflow.'},
    {t:'Init',s:'Setup',h:'Initialize Constructor Studio',body:'Set up Constructor Studio in your repository. The cfs CLI creates the control surface — config, generated host integrations, and validation infrastructure.',boxes:[['What gets created','.cf-studio/ directory with config, generated integrations for Cursor, Windsurf, Claude Code, Copilot, Codex.'],['Install the SDLC kit','The SDLC kit adds templates, checklists, rules, constraints, and workflows for the full pipeline.']],code:'cfs init\ncfs kit install constructorfabric/studio-kit-sdlc\ncfs generate-agents'},
    {t:'Pipeline',s:'SDLC flow',h:'The SDLC pipeline',body:'Constructor Studio SDLC follows a layered transformation: each artifact is generated from the previous one while preserving traceability through IDs and references. The key principle: if code contradicts design, fix design first, then regenerate code.',boxes:[['Pipeline layers','PRD → ADR + DESIGN → DECOMPOSITION → FEATURE → CODE. Each layer transforms the previous artifact into a new form.'],['Validation gates','Every layer has deterministic validation (300+ criteria for PRD, 380+ for DESIGN, etc.) that checks structure, cross-references, and semantic quality.']],prompt:'/cf-studio show pipeline'},
    {t:'PRD',s:'Requirements',h:'Create the Product Requirements Document',body:'Start with a PRD that captures actors, capabilities, requirements, use cases, and constraints. The PRD is the foundation — every downstream artifact traces back to it via deterministic IDs.',boxes:[['PRD includes','Actors, capabilities, functional requirements, non-functional constraints, use cases, success criteria, and unique IDs for each requirement.'],['Validation','300+ criteria check structure, completeness, ID format, and cross-reference integrity.']],prompt:'/cf-studio make PRD for a lightweight team task manager with projects, tasks, comments, notifications, and a REST API. Include actors, capabilities, requirements, use cases, constraints, and acceptance criteria.'},
    {t:'ADR',s:'Decisions',h:'Record Architecture Decision Records',body:'For each significant architectural choice, create an ADR. ADRs capture context, options considered, the decision made, and consequences. They provide the "why" behind technical decisions.',boxes:[['ADR structure','Context, options considered, decision, consequences, status (proposed/accepted/deprecated).'],['Why ADRs','Future team members understand not just what was decided, but why — preventing repeated debates and regressions.']],prompt:'/cf-studio make ADR for PostgreSQL as the primary database. Include context, options considered (PostgreSQL, MySQL, MongoDB), decision rationale, and consequences.'},
    {t:'Design',s:'Architecture',h:'Create the technical DESIGN',body:'Transform the PRD and ADRs into a technical architecture document. DESIGN defines components, interfaces, data models, sequences, and how the system is structured. It links back to every PRD requirement and ADR decision.',boxes:[['DESIGN includes','Component diagram, interfaces, data models, sequence diagrams, technology choices, non-functional architecture.'],['Validation','380+ criteria verify cross-references to PRD/ADR, completeness, and consistency.']],prompt:'/cf-studio make DESIGN from the PRD and ADRs. Define components, interfaces, data models, API contracts, and sequence diagrams for the task manager.'},
    {t:'Decompose',s:'Feature list',h:'Decompose into features',body:'Break the DESIGN into ordered implementation features. Each feature has dependencies, scope boundaries, and traceability links back to DESIGN components and PRD requirements.',boxes:[['Decomposition modes','By capability (business view), by layer (technical view), or by dependency order.'],['Each feature','Has a unique ID, scope description, dependencies, and links to DESIGN components it implements.']],prompt:'/cf-studio decompose into features. Group by business capability and order by dependencies. Each feature must link back to DESIGN components and PRD requirements.'},
    {t:'Feature',s:'Behavior spec',h:'Write detailed FEATURE specifications',body:'Each feature becomes a detailed behavior specification using Constructor Studio DSL (CDSL). Features express flows, algorithms, states, edge cases, and definitions of done that can be implemented directly.',boxes:[['CDSL','Constructor Studio DSL describes behavior as flows, algorithms, and state machines — precise enough for code generation.'],['Definitions of done','Each feature includes explicit acceptance criteria, edge cases, error handling, and testing requirements.']],prompt:'/cf-studio make FEATURE for authentication. Include CDSL flows for login, registration, password reset, session management. Define states, edge cases, error handling, and definitions of done.'},
    {t:'Implement',s:'Code gen',h:'Generate code from features',body:'Use your AI coding tool to implement features. Constructor Studio generates code from FEATURE specs, adding @cpt-* markers for traceability. Every code block links back to a specific feature, design component, and PRD requirement.',boxes:[['Marker system','@cpt-* comments in code link implementation to FEATURE flows, DESIGN components, and PRD requirements.'],['Supported tools','Cursor, Windsurf, VS Code/Copilot, Claude Code, Codex — all connected via cfs generate-agents.']],prompt:'/cf-studio implement authentication step by step. Generate code from the FEATURE spec, add @cpt-* markers for traceability, and create tests for each flow.'},
    {t:'Validate',s:'Checks',h:'Run deterministic validation',body:'Validate the entire pipeline. Check that every artifact is discoverable, linked, and consistent. Cross-reference validation proves alignment across requirements, design, and implementation.',code:'cfs validate\nfs validate refs\nfs validate code coverage',boxes:[['What validation checks','ID resolution, cross-link integrity, orphan detection, code marker coverage, spec completeness.'],['CI integration','Run validation in CI pipelines to catch drift before merge. Deterministic checks for AI-generated output.']],prompt:'/cf-studio validate all. Show the pipeline status, check cross-references, report code coverage, and identify any orphaned artifacts or broken links.'},
    {t:'Insight',s:'Metrics',h:'Measure productivity with Constructor Insight',body:'Constructor Insight defines roles and activities, connects to your systems, and measures productivity at individual, team, and organization levels. Correlate AI adoption with real output.',boxes:[['What it measures','Structure (Studio usage), efficiency, performance, reliability, AI adoption correlation.'],['Drill-down','Headline metrics → source data. Identify where AI investments actually move the needle.']],prompt:'/cf-studio set up Insight for the project. Define roles, connect to the repository, and configure productivity metrics to track AI adoption impact.'},
    {t:'Review',s:'Quality gate',h:'Final review and handoff',body:'Run a full workspace review. Verify all artifacts are consistent, traceable, and ready for sustained development. Check that every code marker resolves, every feature traces to a PRD goal, and validation passes.',boxes:[['Review checklist','All IDs resolve, no orphan tasks, code coverage complete, validation passes, specs match implementation.'],['Handoff','Commit .cf-studio/ config. Team members can cfs init and continue with full traceability intact.']],prompt:'/cf-studio validate all and generate a coverage report. Summarize artifact status, traceability completeness, and any remaining gaps for team handoff.'}
  ];
  let idx=0;
  function renderNav(){document.getElementById('nav').innerHTML=steps.map((x,i)=>'<div class="step '+(i===idx?'active':'')+'" data-i="'+i+'"><div class="num">'+(i+1)+'</div><div><b>'+x.t+'</b><span>'+x.s+'</span></div></div>').join('');document.querySelectorAll('.step').forEach(e=>e.onclick=()=>{idx=Number(e.dataset.i);render();});}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function render(){renderNav();const x=steps[idx];let html='<h2>'+esc(x.h)+'</h2><p class="lead">'+esc(x.body)+'</p>';if(x.quote){html+='<div class="quote">'+esc(x.quote)+'</div>';}if(x.boxes){html+='<div class="grid">'+x.boxes.map(b=>'<div class="box"><b>'+esc(b[0])+'</b><p>'+esc(b[1])+'</p></div>').join('')+'</div>';}if(x.prompt){html+='<div class="prompt"><div class="prompt-head"><div><b>Prompt to copy into IDE</b><br><span>Copy this text, paste it into Cursor, Windsurf, VS Code/Copilot, Codex, or Claude Code, then send.</span></div><button class="btn secondary" id="copyPrompt" title="Copy prompt to clipboard">⧉ Copy prompt</button></div><textarea class="prompt-text" id="promptText" readonly spellcheck="false" aria-label="Prompt text to copy">'+esc(x.prompt)+'</textarea><span class="copy-ok" id="copyStatus"></span></div>';}if(x.code){html+='<div class="code">'+esc(x.code)+'</div>';}document.getElementById('content').innerHTML=html;const copy=document.getElementById('copyPrompt');if(copy){copy.onclick=async()=>{const ta=document.getElementById('promptText');ta.focus();ta.select();let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(ta.value);ok=true;}}catch(e){}if(!ok){try{ok=document.execCommand('copy');}catch(e){ok=false;}}document.getElementById('copyStatus').textContent=ok?'Copied to clipboard.':'Selected — press Ctrl+C, then paste into your IDE.';};}document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===steps.length-1?'Finish trainer':'Next step';document.getElementById('foot').textContent='Step '+(idx+1)+' of '+steps.length+' — Constructor Fabric SDLC pipeline';document.getElementById('configPill').textContent='PRD → ADR → DESIGN → DECOMPOSITION → FEATURE → CODE';}
  document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
  document.getElementById('next').onclick=()=>{if(idx<steps.length-1){idx++;render();}else{window.close();}};
  render();
  </script>
</body>
</html>
