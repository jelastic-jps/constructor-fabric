<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constructor Fabric AI Fabric Trainer</title>
  <style>
    :root{color-scheme:dark;--bg:#162a42;--panel:#1e3654;--panel2:#243e5e;--text:#eef6ff;--muted:#b0c4d8;--accent:#2dd4bf;--accent2:#60a5fa;--ok:#34d399;--gold:#f7c873}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 18% 0%,#2a5a8c 0,#162a42 42%,#0e1e30 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px}
    .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:12px 10px;background:rgba(14,30,48,.76);border-right:1px solid rgba(255,255,255,.08)}
    .brand{display:flex;gap:8px;align-items:center;margin-bottom:10px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#04111f;font-size:11px;box-shadow:0 8px 20px rgba(45,212,191,.18)}.brand h1{font-size:11px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:9px}
    .step{display:flex;gap:6px;padding:6px 6px;margin:3px 0;border-radius:8px;color:var(--muted);cursor:pointer;border:1px solid transparent;font-size:10px}.step.active{background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.35);color:var(--text)}.num{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#1a3050;color:#cce4ff;font-weight:800;font-size:9px;flex-shrink:0}.step.active .num{background:var(--accent);color:#05201d}.step b{display:block;font-size:10px}.step span{font-size:8px}
    .main{padding:14px 18px}.card{background:linear-gradient(180deg,rgba(30,54,84,.94),rgba(16,30,52,.94));border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;box-shadow:0 12px 36px rgba(0,0,0,.30);min-height:0;display:flex;flex-direction:column}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(45,212,191,.35);color:#9ff5e9;background:rgba(45,212,191,.09);border-radius:999px;padding:4px 8px;font-size:9px;margin-bottom:8px}.status-dot{width:6px;height:6px;background:var(--ok);border-radius:99px;box-shadow:0 0 8px var(--ok)}
    h2{font-size:16px;line-height:1.1;margin:8px 0 6px}.lead{font-size:11px;color:#c9d8e8;line-height:1.5;max-width:850px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.box{background:rgba(255,255,255,.048);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:8px}.box b{display:block;margin-bottom:4px;color:#fff;font-size:10px}.box p,.box li{color:var(--muted);line-height:1.45;margin:0;font-size:10px}.quote{border-left:3px solid var(--accent);background:rgba(45,212,191,.075);padding:8px 10px;border-radius:8px;color:#dffdf8;line-height:1.45;margin-top:10px;font-size:10px}.code,.prompt-text{font-family:"SFMono-Regular",Consolas,monospace;background:#0e1a2c;border:1px solid rgba(255,255,255,.11);border-radius:8px;padding:8px;color:#d7ecff;white-space:pre-wrap;font-size:10px}.prompt{margin-top:10px}.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}.prompt-head b{color:#fff;font-size:10px}.prompt-head span{color:var(--muted);font-size:8px}.prompt-text{width:100%;min-height:60px;resize:none;outline:0;background:#111827;color:#cbd5e1;border-color:#334155;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);cursor:text;font-size:9px}.prompt-text[readonly]{user-select:text;-webkit-user-select:text}.copy-ok{color:#9ff5e9;font-size:9px;margin-left:6px}.buttons{display:flex;gap:8px;align-items:center;margin-top:10px}.btn{border:0;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:10px}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#02111f}.secondary{background:#172944;color:#d8e9ff;border:1px solid rgba(255,255,255,.10)}.foot{margin-top:8px;color:var(--muted);font-size:9px}.accent{color:var(--gold)}
  </style>
</head>
<body>
  <div class="app"><aside class="side"><div class="brand"><div class="logo">CF</div><div><h1>Constructor Fabric</h1><p>AI Fabric Trainer</p></div></div><div id="nav"></div></aside><main class="main"><section class="card"><div class="pill"><span class="status-dot"></span><span id="configPill">Ready for the AI fabric trainer</span></div><div id="content"></div><div class="buttons"><button class="btn secondary" id="prev">Back</button><button class="btn primary" id="next">Next step</button></div><div class="foot" id="foot"></div></section></main></div>
  <script>
  const steps = [
    {t:'Welcome',s:'Overview',h:'Constructor Fabric — AI fabric for SaaS',body:'Constructor Fabric connects the software development lifecycle: plan, build, validate, and hand off. It adds structure, traceability, and deterministic checks to your existing AI coding workflow. This trainer uses the real /cf-constructor workflow and cfc CLI commands installed in this environment.',boxes:[['What you will learn','How to move from a product idea to PRD, features, implementation tasks, plans, validation, and handoff using copy-ready prompts.'],['Ready workspace','The demo workspace is pre-initialized with .cf-constructor, generated integrations, Continue /cf-constructor prompt, and cfc/cf-constructor CLI access.']],quote:'Use /cf-constructor in the IDE chat. Use cfc in the terminal. These are the commands installed in this environment.'},
    {t:'Init',s:'Setup',h:'Start from the prepared Constructor Fabric workspace',body:'The workspace is already initialized. Use the IDE chat path for normal work, or inspect the adapter from a terminal when you want to verify setup.',boxes:[['Option A: IDE chat','Open VSCodium Continue and type /cf. Choose cf-constructor, paste the prompt below, and send.'],['Option B: Terminal check','Run the commands below in the workspace to confirm that .cf-constructor is present and the CLI sees it.'],['What exists','.cf-constructor/ contains the adapter, generated agent instructions, cypilot skills, validation rules, templates, and workflow metadata.']],prompt:'/cf-constructor Inspect this prepared Constructor Fabric workspace. Confirm that .cf-constructor is available, explain how to use the workflow, and summarize the next best step for creating product artifacts.',code:'cd ${HOME}/workspaces/constructor-fabric-workspace\ncfc info\ncfc status || true'},
    {t:'Product brief',s:'Idea → PRD',h:'Create the product requirements document',body:'Ask the agent to create a concise PRD from the idea. The goal is to capture users, goals, core scenarios, constraints, non-goals, success metrics, and acceptance criteria before jumping into implementation.',boxes:[['Expected artifact','A PRD or product brief that explains who the product is for, what problem it solves, and what done looks like.'],['Copy/paste flow','Use the Copy prompt button, switch to VSCodium Continue or another generated agent chat, paste, and send.']],prompt:'/cf-constructor Create a PRD for a lightweight team task manager with projects, tasks, comments, notifications, and a REST API. Include target users, product goals, core user journeys, non-goals, constraints, success metrics, and acceptance criteria.'},
    {t:'Features',s:'PRD → scope',h:'Decompose the product into features',body:'Next, split the PRD into a small set of implementation features. Each feature should have clear user value, acceptance criteria, dependencies, risks, and traceability back to the product goals.',boxes:[['Feature examples','Authentication, project workspace, task workflow, comments, notifications, API surface, and audit/history.'],['Quality bar','Each feature should be independently understandable, reviewable, and traceable to the PRD.']],prompt:'/cf-constructor Decompose the PRD into feature artifacts. For each feature include user value, acceptance criteria, dependencies, risks, and traceability back to the PRD goals.'},
    {t:'Tasks',s:'Features → backlog',h:'Turn features into implementation tasks',body:'For each feature, ask Constructor Fabric to produce engineering tasks that are small enough to execute and review. Tasks should include intent, expected files or modules, tests, and completion criteria.',boxes:[['Task examples','Create project data model, implement task status transitions, add comments endpoint, add notification event contract, write validation tests.'],['Traceability','Every task should link back to a feature and PRD goal so the work stays auditable.']],prompt:'/cf-constructor Create an implementation task backlog for these features. Each task must include intent, expected files or modules, test requirements, completion criteria, dependencies, and traceability to the PRD and feature acceptance criteria.'},
    {t:'Plans',s:'Backlog → execution',h:'Create implementation-ready plans',body:'Now convert the backlog into an execution plan. A good plan explains sequencing, risks, test strategy, review checkpoints, validation commands, and rollback notes so another agent or engineer can implement safely.',boxes:[['Expected artifact','A sequenced implementation plan with milestones, quality gates, and validation steps.'],['Ready for handoff','The output should be specific enough that another IDE agent can implement from it without guessing.']],prompt:'/cf-constructor Produce implementation plans for the task backlog. Include sequencing, milestones, tests, risks, rollback notes, review checkpoints, and validation commands.'},
    {t:'Artifacts',s:'Generate outputs',h:'Generate and inspect the artifacts',body:'Use the selected AI agent to create the actual Constructor Fabric artifacts in the workspace. Review the result as a product tree: PRD → features → tasks → plans. The showcase should demonstrate that every lower-level item traces back to a higher-level decision.',boxes:[['What to inspect','Open the generated artifacts, check naming, traceability IDs, acceptance criteria, and task completeness.'],['Quality signal','The workspace should read like a complete product decomposition, not a random collection of notes.']],prompt:'/cf-constructor Review the generated Constructor Fabric artifacts as a PRD → features → tasks → plans tree. Identify any missing links, weak acceptance criteria, duplicate tasks, or gaps that should be fixed before validation.'},
    {t:'Validate',s:'Traceability',h:'Validate the complete flow',body:'Finish by running deterministic checks from the workspace root. Validation proves that the artifacts are discoverable, linked, and ready for the next implementation stage.',code:'cd ${HOME}/workspaces/constructor-fabric-workspace\ncfc validate\ncfc list-ids\ncfc toc',boxes:[['Success criteria','Validation passes, IDs are listed, and the table of contents shows a coherent PRD → features → tasks → plans flow.'],['Optional final step','Create a local commit only after the artifacts are validated and reviewed.']],prompt:'/cf-constructor Fix any validation or traceability issues reported by cfc validate, then summarize the final PRD → features → tasks → plans structure and the remaining implementation risks.'}
  ];
  let idx=0;
  function renderNav(){document.getElementById('nav').innerHTML=steps.map((x,i)=>'<div class="step '+(i===idx?'active':'')+'" data-i="'+i+'"><div class="num">'+(i+1)+'</div><div><b>'+x.t+'</b><span>'+x.s+'</span></div></div>').join('');document.querySelectorAll('.step').forEach(e=>e.onclick=()=>{idx=Number(e.dataset.i);render();});}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function render(){renderNav();const x=steps[idx];let html='<h2>'+esc(x.h)+'</h2><p class="lead">'+esc(x.body)+'</p>';if(x.quote){html+='<div class="quote">'+esc(x.quote)+'</div>';}if(x.boxes){html+='<div class="grid">'+x.boxes.map(b=>'<div class="box"><b>'+esc(b[0])+'</b><p>'+esc(b[1])+'</p></div>').join('')+'</div>';}if(x.prompt){html+='<div class="prompt"><div class="prompt-head"><div><b>Prompt to copy into IDE</b><br><span>Copy this text, paste it into Cursor, Windsurf, VS Code/Copilot, Codex, or Claude Code, then send.</span></div><button class="btn secondary" id="copyPrompt" title="Copy prompt to clipboard">⧉ Copy prompt</button></div><textarea class="prompt-text" id="promptText" readonly spellcheck="false" aria-label="Prompt text to copy">'+esc(x.prompt)+'</textarea><span class="copy-ok" id="copyStatus"></span></div>';}if(x.code){html+='<div class="code">'+esc(x.code)+'</div>';}document.getElementById('content').innerHTML=html;const copy=document.getElementById('copyPrompt');if(copy){copy.onclick=async()=>{const ta=document.getElementById('promptText');ta.focus();ta.select();let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(ta.value);ok=true;}}catch(e){}if(!ok){try{ok=document.execCommand('copy');}catch(e){ok=false;}}document.getElementById('copyStatus').textContent=ok?'Copied to clipboard.':'Selected — press Ctrl+C, then paste into your IDE.';};}document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===steps.length-1?'Finish trainer':'Next step';document.getElementById('foot').textContent='Step '+(idx+1)+' of '+steps.length+' — Constructor Fabric basic flow showcase';document.getElementById('configPill').textContent='Use /cf-constructor in IDE chat, cfc in terminal';}
  document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
  document.getElementById('next').onclick=()=>{if(idx<steps.length-1){idx++;render();}else{window.close();}};
  render();
  </script>
</body>
</html>
